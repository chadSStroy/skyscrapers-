<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <style>
        :root {
            --bg-color: #08080a;
            --card-bg: rgba(18, 18, 24, 0.75);
            --dark-purple: #3c1361;
            --deep-purple-accent: #52188c;
            --text-muted: #8c43e6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glow Effect */
        body::before {
            content: '';
            position: fixed;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(82, 24, 140, 0.25) 0%, rgba(60, 19, 97, 0.1) 50%, transparent 70%);
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 32px;
            z-index: 1;
        }

        /* Главный текст темно-фиолетового цвета */
        h1 {
            font-size: clamp(3.2rem, 12vw, 4.8rem);
            font-weight: 900;
            letter-spacing: -2px;
            line-height: 0.95;
            text-transform: lowercase;
            color: #4a154b;
            background: linear-gradient(135deg, #7b2cbf 0%, #4a1272 60%, #200538 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(82, 24, 140, 0.4);
            margin: 10px 0;
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% {
                filter: drop-shadow(0 0 10px rgba(82, 24, 140, 0.3));
            }
            100% {
                filter: drop-shadow(0 0 25px rgba(123, 44, 191, 0.6));
            }
        }

        /* Player Card */
        .player-card {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid rgba(82, 24, 140, 0.25);
            border-radius: 28px;
            padding: 20px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7),
                        0 0 0 1px rgba(82, 24, 140, 0.2);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* YouTube Embed */
        .youtube-iframe {
            border-radius: 18px;
            width: 100%;
            height: 250px;
            border: none;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        }

        /* Нижний текст u can always count on me grl */
        .bottom-message {
            font-size: 1rem;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: lowercase;
            padding-top: 4px;
        }

        /* Блок контактов */
        .socials {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-top: 14px;
            border-top: 1px solid rgba(82, 24, 140, 0.25);
            width: 100%;
        }

        .social-item {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .social-item span {
            color: #f0f0f5;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Основной огромный текст -->
        <h1>happy<br>birthday</h1>

        <!-- Карточка с плеером и контактами -->
        <div class="player-card">
            <!-- Официальное видео Lil Peep - Crybaby -->
            <iframe 
                class="youtube-iframe"
                src="https://www.youtube.com/embed/P28E3c1zJ4w" 
                title="Lil Peep - crybaby"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>

            <!-- Надпись под плеером -->
            <div class="bottom-message">
                u can always count on me grl
            </div>

            <!-- Контакты -->
            <div class="socials">
                <div class="social-item">tg: <span>@gasagnnn</span></div>
                <div class="social-item">ig: <span>yk my ig js unblock me</span></div>
                <div class="social-item">tt: <span>yk it too</span></div>
            </div>
        </div>
    </div>

</body>
</html>
