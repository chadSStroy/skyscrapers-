<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <style>
        :root {
            --bg-color: #08080a;
            --card-bg: rgba(18, 18, 24, 0.75);
            --accent-pink: #ff2a75;
            --accent-purple: #9d4edd;
            --text-main: #f0f0f5;
            --text-muted: #a0a0b0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glow Effect */
        body::before {
            content: '';
            position: fixed;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(255, 42, 117, 0.22) 0%, rgba(157, 78, 221, 0.12) 50%, transparent 70%);
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 36px;
            z-index: 1;
        }

        /* Главный крупный акцентный текст */
        h1 {
            font-size: clamp(3.2rem, 12vw, 4.8rem);
            font-weight: 900;
            letter-spacing: -2px;
            line-height: 0.95;
            text-transform: lowercase;
            background: linear-gradient(135deg, #ffffff 0%, #e0e0f0 40%, var(--accent-pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 35px rgba(255, 42, 117, 0.35);
            margin: 10px 0;
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% {
                filter: drop-shadow(0 0 15px rgba(255, 42, 117, 0.2));
            }
            100% {
                filter: drop-shadow(0 0 30px rgba(255, 42, 117, 0.5));
            }
        }

        /* Player Card */
        .player-card {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 20px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7),
                        0 0 0 1px rgba(255, 42, 117, 0.15);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Spotify Album Embed */
        .spotify-iframe {
            border-radius: 18px;
            width: 100%;
            height: 352px;
            border: none;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        /* Замена блока социалок на финальный текст */
        .bottom-message {
            font-size: 1rem;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.5px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            text-transform: lowercase;
            transition: color 0.3s ease;
        }

        .bottom-message:hover {
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Основной огромный текст -->
        <h1>happy<br>birthday</h1>

        <!-- Карточка с альбомом Crybaby -->
        <div class="player-card">
            <iframe 
                class="spotify-iframe"
                src="https://open.spotify.com/embed/album/6Kd4dA39h3qJliWiB12KFd?utm_source=generator&theme=0" 
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                loading="lazy">
            </iframe>

            <!-- Вместо контактов и соцсетей -->
            <div class="bottom-message">
                u can always count on me grl
            </div>
        </div>
    </div>

</body>
</html>
