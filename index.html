<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <style>
        :root {
            --bg-color: #08080a;
            --card-bg: rgba(18, 18, 24, 0.75);
            --dark-purple: #3c1361;
            --deep-purple-accent: #52188c;
            --text-muted: #8c43e6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glow Effect */
        body::before {
            content: '';
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(82, 24, 140, 0.25) 0%, rgba(60, 19, 97, 0.1) 50%, transparent 70%);
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 1;
        }

        /* Card Container */
        .card {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid rgba(82, 24, 140, 0.25);
            border-radius: 28px;
            padding: 28px 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7),
                        0 0 0 1px rgba(82, 24, 140, 0.2);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Цитата */
        .quote {
            font-size: 1.35rem;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: -0.2px;
            text-transform: lowercase;
            line-height: 1.4;
        }

        /* Блок контактов */
        .socials {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-top: 16px;
            border-top: 1px solid rgba(82, 24, 140, 0.25);
            width: 100%;
        }

        .social-item {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .social-item span {
            color: #f0f0f5;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <!-- Фраза -->
            <div class="quote">
                i js wanna see u smile<br>i js wanna make u mine
            </div>

            <!-- Контакты -->
            <div class="socials">
                <div class="social-item">tg: <span>@gasagnnn</span></div>
            </div>
        </div>
    </div>

</body>
</html>
